<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis PC Local</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">JARVIS · PC LOCAL</p>
    <h1 id="heading">Starting your workspace</h1>
    <p id="status" role="status" aria-live="polite">Checking Jarvis at 127.0.0.1:8000…</p>
    <button id="retry" type="button" hidden>Retry startup</button>
    <p class="detail">Local only. An existing Jarvis session remains under your control.</p>
  </main>
</body>
</html>
